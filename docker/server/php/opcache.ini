[opcache]
; ====== CORE ENABLE ======
opcache.enable = 1
opcache.enable_cli = 1

; ====== MEMORY & CAPACITY ======
; Total memory allocated to OPcache (in MB)
opcache.memory_consumption = 256
; Memory allocated for internal string constants
opcache.interned_strings_buffer = 16
; Maximum number of files OPcache can hold
opcache.max_accelerated_files = 30000

; ====== LOCAL DEVELOPMENT SETTINGS ======
; Must be 1 in dev so code changes reflect immediately without restarting Docker
opcache.validate_timestamps = 1
; Check file modification times on every single request
opcache.revalidate_freq = 0
; Check file timestamps even when working with symbolic links
opcache.revalidate_path = 1

; ====== LARAVEL OPTIMIZATIONS ======
; Required by Laravel framework for DocBlock comments & attributes
opcache.save_comments = 1
; Speeds up request shutdowns by releasing memory in blocks
opcache.fast_shutdown = 1

; ====== PHP 8 JIT COMPILER ======
; Tracing mode provides the best CPU optimization for Laravel
opcache.jit = tracing
; Buffer size for compiled JIT code (must be > 0 to enable JIT)
opcache.jit_buffer_size = 128M